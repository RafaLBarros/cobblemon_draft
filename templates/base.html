<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cobblemon Random Draft{% endblock %}</title>
    <style>
        :root {
            --bg: #0f0f14;
            --panel: #1a1a23;
            --panel-2: #242432;
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --accent: #8b5cf6;
            --accent-2: #a78bfa;
            --danger: #ef4444;
            --success: #22c55e;
            --border: #363646;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: radial-gradient(circle at top, #1f1b36 0, var(--bg) 360px);
            color: var(--text);
        }
        a { color: var(--accent-2); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .container {
            max-width: 1040px;
            margin: 0 auto;
            padding: 28px 16px 48px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        .brand {
            font-weight: 700;
            letter-spacing: .2px;
        }
        .nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 14px;
        }
        .card {
            background: rgba(26, 26, 35, .94);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            margin: 16px 0;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }
        h1, h2, h3 { margin-top: 0; }
        h1 { font-size: 30px; margin-bottom: 10px; }
        h2 { font-size: 20px; }
        h3 { font-size: 17px; }
        p { line-height: 1.5; }
        .muted { color: var(--muted); }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            background: #30284e;
            color: #ddd6fe;
            border: 1px solid #514176;
            border-radius: 999px;
            font-size: 13px;
            margin: 2px 4px 2px 0;
        }
        .badge.warning { background: #3f3014; color: #fde68a; border-color: #7c5b18; }
        .badge.success { background: #10351f; color: #bbf7d0; border-color: #1f7a3b; }
        .badge.danger { background: #41191d; color: #fecdd3; border-color: #7f1d1d; }
        input, button, select {
            font: inherit;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            color: var(--text);
            background: #11111a;
            outline: none;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--accent);
        }
        button, .button {
            display: inline-block;
            padding: 10px 14px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: white;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
        }
        button:hover, .button:hover { filter: brightness(1.08); text-decoration: none; }
        button.secondary { background: var(--panel-2); border: 1px solid var(--border); }
        button.danger { background: var(--danger); }
        button:disabled { opacity: .45; cursor: not-allowed; }
        form.inline { display: inline; }
        .option-button {
            width: 100%;
            text-align: left;
            background: var(--panel-2);
            border: 1px solid var(--border);
            margin: 6px 0;
        }
        .flash {
            padding: 12px 14px;
            border-radius: 12px;
            margin: 10px 0;
            background: var(--panel-2);
            border: 1px solid var(--border);
        }
        .flash.success { border-color: #1f7a3b; background: #10351f; }
        .flash.error { border-color: #7f1d1d; background: #41191d; }
        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 12px;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            vertical-align: top;
        }
        th { color: #ddd6fe; font-size: 14px; }
        ol, ul { padding-left: 22px; }
        li { margin: 6px 0; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .small { font-size: 13px; }
        .hr { border-top: 1px solid var(--border); margin: 16px 0; }
        @media (max-width: 680px) {
            .topbar { align-items: flex-start; flex-direction: column; }
            table, thead, tbody, th, td, tr { display: block; }
            th { display: none; }
            td { border-bottom: 0; padding: 6px 0; }
            tr { border-bottom: 1px solid var(--border); padding: 10px 0; }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="topbar">
            <div class="brand">Cobblemon Random Draft</div>
            <div class="nav">
                <a href="{{ url_for('index') }}">Entrada</a>
                <a href="{{ url_for('master_page', key=master_key) }}">Mestre cego</a>
                <a href="{{ url_for('admin_page', key=admin_key) }}">Admin</a>
            </div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
